name: Generate contribution snake

on:
  schedule:
    # roughly every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs (themed to brand colors)
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=6d5bd0&color_dots=#ebedf0,#cfe0ff,#8fb8ff,#4a90ff,#0a84ff
            dist/github-snake-dark.svg?color_snake=8f7bf0&color_dots=#161b22,#0d2a5e,#1e56b0,#2f7bff,#6d5bd0

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
